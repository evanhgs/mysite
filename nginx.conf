worker_processes auto;

# PID dans /tmp (toujours accessible en écriture)
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log off;
    error_log  /dev/stderr warn;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    keepalive_requests 1000;

    # Fichiers pré-compressés au build (voir Dockerfile) : nginx sert
    # directement le .gz sans compresser à la volée.
    gzip_static on;

    # Repli dynamique pour ce qui n'est pas pré-compressé
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_vary on;

    # Cache des descripteurs de fichiers servis souvent
    open_file_cache max=1000 inactive=30s;
    open_file_cache_valid 60s;
    open_file_cache_min_uses 2;

    # Anciennes URL (site FR/EN et journal) → nouvelles adresses, en un seul
    # saut. Même table que les « redirects » de vercel.json.
    # /fr/ n'est PAS redirigé : l'ancienne redirection permanente / → /fr/
    # peut être en cache chez les visiteurs, /fr/ → / bouclerait.
    map $uri $legacy {
        default "";
        /rss.xml     /;
        /og.png      /og/accueil.png;
        /favicon.svg /icon.svg;
        ~^/en/?$ /;
        ~^/(?:fr|en)/about/?$ /a-propos/;
        ~^/(?:fr/projets|en/projects)/?$ /projets/;
        ~^/(?:fr/projets|en/projects)/sae5-aramis/?$ /projets/aramis/;
        ~^/(?:fr/projets|en/projects)/(?<s>rmce|turbo-selector|valenstagram|telebox)/?$ /projets/$s/;
        ~^/(?:fr/projets|en/projects)/(?:dashdust|hibiki|wipytest)/?$ /projets/;
        ~^/fr/blog/(?<b>telebox|turbo-selector|valenstagram)/?$ /projets/$b/;
        ~^/(?:fr|en)/blog(?:/.*)?$ /projets/;
        ~^/en/ /;
    }

    server {
        listen       8080;
        server_name  localhost;
        # https://evanhgs.fr

        root /usr/share/nginx/html;
        index index.html;

        # Derrière un proxy TLS : redirections relatives, jamais http://host:8080/…
        absolute_redirect off;

        # En-têtes par défaut (HTML). Les locations qui déclarent leurs propres
        # add_header doivent les répéter : nginx ne les hérite pas.
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; font-src 'self'; connect-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; object-src 'none'; upgrade-insecure-requests" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), accelerometer=(), gyroscope=(), magnetometer=()" always;

        if ($legacy) {
            return 301 $legacy;
        }

        location / {
            try_files $uri $uri/ $uri.html =404;
        }

        # Assets fingerprintés par Astro : cache immuable 1 an
        location /_astro/ {
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Cross-Origin-Opener-Policy "same-origin" always;
        }

        # Images OG et couvertures : noms stables, donc cache court
        location ~ ^/(?:og|covers)/ {
            add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800" always;
            add_header X-Content-Type-Options "nosniff" always;
        }

        error_page 404 /404.html;
    }
}
